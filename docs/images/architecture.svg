<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 1040" width="1192" height="1040" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>C4 container diagram: an agent harness calls the MCP server; the portal reaches it in process and runs decision-derive; the server reads the environment, searches the document store and, for routing and judges only, asks CLM; decision-derive asks a language model for rules; your tools act on your systems</title>
  <style>
    .bg { fill: #ffffff; }
    .person { fill: #08427b; }
    .ext { fill: #6b6b6b; }
    .cont { fill: #2f6db3; }
    .name { fill: #ffffff; font-size: 18px; font-weight: 600; }
    .tech { fill: #ffffff; font-size: 13px; opacity: 0.9; }
    .desc { fill: #ffffff; font-size: 15px; }
    .frame { fill: none; stroke: #8a8a8a; stroke-width: 2; stroke-dasharray: 8 6; }
    .frame-label { fill: #444444; font-size: 15px; }
    .line { stroke: #6b6b6b; stroke-width: 1.6; fill: none; }
    .head { fill: #6b6b6b; }
    .label { fill: #444444; font-size: 14px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .frame { stroke: #6e7681; }
      .frame-label, .label { fill: #c9d1d9; }
      .label { stroke: #0d1117; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1192" height="1040" rx="12"/>
  <rect class="frame" x="24" y="216" width="1144" height="608" rx="8"/>
  <text class="frame-label" x="316" y="804"><tspan font-weight="600">MCP decision server</tspan> [Software System]</text>
  <path class="line" d="M176,168 L176,271" marker-end="url(#arrow)"/>
  <path class="line" d="M596,168 L596,271" marker-end="url(#arrow)"/>
  <path class="line" d="M304,344 L467,344" marker-end="url(#arrow)"/>
  <path class="line" d="M724,344 L887,344" marker-end="url(#arrow)"/>
  <path class="line" d="M552,416 L552,567" marker-end="url(#arrow)"/>
  <path class="line" d="M640,416 L640,492 L1016,492 L1016,567" marker-end="url(#arrow)"/>
  <path class="line" d="M176,416 L176,567" marker-end="url(#arrow)"/>
  <path class="line" d="M304,640 L467,640" marker-end="url(#arrow)"/>
  <path class="line" d="M220,712 L220,760 L972,760 L972,713" marker-end="url(#arrow)"/>
  <path class="line" d="M132,712 L132,871" marker-end="url(#arrow)"/>
  <path class="line" d="M1060,712 L1060,871" marker-end="url(#arrow)"/>
  <rect class="person" x="48" y="48" width="256" height="120" rx="28"/>
  <text class="name" x="176" y="82" text-anchor="middle">Administrator</text>
  <text class="tech" x="176" y="106" text-anchor="middle">[Person]</text>
  <text class="desc" x="176" y="126" text-anchor="middle">Configures and tests the</text>
  <text class="desc" x="176" y="146" text-anchor="middle">server; approves derived rules</text>
  <rect class="ext" x="468" y="48" width="256" height="120" rx="6"/>
  <text class="name" x="596" y="82" text-anchor="middle">MCP agent</text>
  <text class="tech" x="596" y="106" text-anchor="middle">[Software System]</text>
  <text class="desc" x="596" y="126" text-anchor="middle">A harness such as Claude Code,</text>
  <text class="desc" x="596" y="146" text-anchor="middle">ollmcp or Databricks</text>
  <rect class="cont" x="48" y="272" width="256" height="144" rx="6"/>
  <text class="name" x="176" y="307" text-anchor="middle">Portal</text>
  <text class="tech" x="176" y="331" text-anchor="middle">[Container: Python, same process]</text>
  <text class="desc" x="176" y="355" text-anchor="middle">Configuration, Ask, Review,</text>
  <text class="desc" x="176" y="375" text-anchor="middle">Documents and Server pages;</text>
  <text class="desc" x="176" y="395" text-anchor="middle">runs jobs</text>
  <rect class="cont" x="468" y="272" width="256" height="144" rx="6"/>
  <text class="name" x="596" y="307" text-anchor="middle">MCP server</text>
  <text class="tech" x="596" y="331" text-anchor="middle">[Container: Python, MCP SDK]</text>
  <text class="desc" x="596" y="355" text-anchor="middle">Serves an environment (weighs</text>
  <text class="desc" x="596" y="375" text-anchor="middle">options) or a scenario</text>
  <text class="desc" x="596" y="395" text-anchor="middle">(routes); traces every call</text>
  <rect class="cont" x="888" y="272" width="256" height="144" rx="6"/>
  <text class="name" x="1016" y="307" text-anchor="middle">CLM</text>
  <text class="tech" x="1016" y="331" text-anchor="middle">[Container: MLX or PyTorch]</text>
  <text class="desc" x="1016" y="355" text-anchor="middle">Optional: ranks a scenario's</text>
  <text class="desc" x="1016" y="375" text-anchor="middle">routes; answers a judge's</text>
  <text class="desc" x="1016" y="395" text-anchor="middle">yes/no question</text>
  <rect class="cont" x="48" y="568" width="256" height="144" rx="6"/>
  <text class="name" x="176" y="603" text-anchor="middle">decision-derive</text>
  <text class="tech" x="176" y="627" text-anchor="middle">[Container: Python CLI]</text>
  <text class="desc" x="176" y="651" text-anchor="middle">Derives rules from documents</text>
  <text class="desc" x="176" y="671" text-anchor="middle">and checks them; a person</text>
  <text class="desc" x="176" y="691" text-anchor="middle">approves</text>
  <rect class="cont" x="468" y="568" width="256" height="144" rx="6"/>
  <text class="name" x="596" y="613" text-anchor="middle">Document store</text>
  <text class="tech" x="596" y="637" text-anchor="middle">[Container: PostgreSQL, pgvector]</text>
  <text class="desc" x="596" y="661" text-anchor="middle">Optional: documents,</text>
  <text class="desc" x="596" y="681" text-anchor="middle">passages and citations</text>
  <rect class="cont" x="888" y="568" width="256" height="144" rx="6"/>
  <text class="name" x="1016" y="603" text-anchor="middle">Environment</text>
  <text class="tech" x="1016" y="627" text-anchor="middle">[Files: TOML, DMN, CSV, Python]</text>
  <text class="desc" x="1016" y="651" text-anchor="middle">Rules, queries, scenarios or</text>
  <text class="desc" x="1016" y="671" text-anchor="middle">routes, and your tools; graph</text>
  <text class="desc" x="1016" y="691" text-anchor="middle">in CSV or Neo4j</text>
  <rect class="ext" x="48" y="872" width="256" height="120" rx="6"/>
  <text class="name" x="176" y="906" text-anchor="middle">Language model</text>
  <text class="tech" x="176" y="930" text-anchor="middle">[Software System]</text>
  <text class="desc" x="176" y="950" text-anchor="middle">Claude, or a local model</text>
  <text class="desc" x="176" y="970" text-anchor="middle">through Ollama</text>
  <rect class="ext" x="888" y="872" width="256" height="120" rx="6"/>
  <text class="name" x="1016" y="906" text-anchor="middle">Your systems</text>
  <text class="tech" x="1016" y="930" text-anchor="middle">[Software System]</text>
  <text class="desc" x="1016" y="950" text-anchor="middle">Ticketing, booking,</text>
  <text class="desc" x="1016" y="970" text-anchor="middle">databases</text>
  <text class="label" x="188" y="215">Configures, asks,</text>
  <text class="label" x="188" y="233">approves [HTTPS]</text>
  <text class="label" x="608" y="207">Calls tools [MCP over HTTP</text>
  <text class="label" x="608" y="225">with a key or OAuth token,</text>
  <text class="label" x="608" y="243">or stdio]</text>
  <text class="label" x="386" y="312" text-anchor="middle">Asks, reloads</text>
  <text class="label" x="386" y="330" text-anchor="middle">[in process]</text>
  <text class="label" x="806" y="330" text-anchor="middle">Ranks options</text>
  <text class="label" x="540" y="497" text-anchor="end">Searches</text>
  <text class="label" x="828" y="460" text-anchor="middle">Reads rules, runs</text>
  <text class="label" x="828" y="478" text-anchor="middle">queries and tools</text>
  <text class="label" x="188" y="497">Runs as a job</text>
  <text class="label" x="386" y="626" text-anchor="middle">Reads documents</text>
  <text class="label" x="596" y="745" text-anchor="middle">Writes derived rules, proposed</text>
  <text class="label" x="144" y="796">Asks for rules</text>
  <text class="label" x="1048" y="788" text-anchor="end">Your tools act</text>
  <text class="label" x="1048" y="806" text-anchor="end">through their APIs</text>
</svg>
