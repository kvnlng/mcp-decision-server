<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 570" width="1044" height="570" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The statuses of a derived rule or fact: decision-derive run proposes it, the mechanical check, with any second reading, marks it checked, a person approves or rejects it, and a failed later check, a new edition, an edited table or a person sends it back to proposed; a conflict with a supplied fact is open until a person resolves it</title>
  <style>
    .bg { fill: #ffffff; }
    .agent { fill: #6b6b6b; }
    .clm { fill: #2f6db3; }
    .yours { fill: #2e7d4f; }
    .reject { fill: #8a3b3b; }
    .conflict { fill: #8f5410; }
    .name { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .sub { fill: #ffffff; font-size: 13px; }
    .note { fill: #fff6d6; stroke: #d4a72c; }
    .ntext { fill: #1f2328; font-size: 13px; }
    .line { stroke: #6b6b6b; stroke-width: 1.6; fill: none; }
    .dash { stroke-dasharray: 6 4; }
    .life { stroke: #9a9a9a; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
    .frame { stroke: #8a8a8a; stroke-width: 1.2; fill: none; }
    .head, .dot { fill: #6b6b6b; }
    .label { fill: #444444; font-size: 13px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    .strong { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .note { fill: #2e2408; stroke: #9e6a03; }
      .ntext { fill: #e6edf3; }
      .line { stroke: #9198a1; }
      .life, .frame { stroke: #6e7681; }
      .head, .dot { fill: #9198a1; }
      .label { fill: #c9d1d9; stroke: #0d1117; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1044" height="570" rx="12"/>
  <circle class="dot" cx="64" cy="150" r="8"/>
  <rect class="clm" x="200" y="120" width="180" height="60" rx="30"/>
  <text class="name" x="290" y="145.5" text-anchor="middle">proposed</text>
  <text class="sub" x="290" y="165.5" text-anchor="middle">by run, or sent back</text>
  <rect class="clm" x="500" y="120" width="180" height="60" rx="30"/>
  <text class="name" x="590" y="145.5" text-anchor="middle">checked</text>
  <text class="sub" x="590" y="165.5" text-anchor="middle">by the check only</text>
  <rect class="yours" x="800" y="120" width="180" height="60" rx="30"/>
  <text class="name" x="890" y="145.5" text-anchor="middle">approved</text>
  <text class="sub" x="890" y="165.5" text-anchor="middle">by a person</text>
  <rect class="reject" x="500" y="280" width="180" height="60" rx="30"/>
  <text class="name" x="590" y="305.5" text-anchor="middle">rejected</text>
  <text class="sub" x="590" y="325.5" text-anchor="middle">never decides</text>
  <path class="line" d="M72,150 L199,150" marker-end="url(#arrow)"/>
  <text class="label" x="136" y="140" text-anchor="middle">decision-derive run</text>
  <path class="line" d="M380,140 L499,140" marker-end="url(#arrow)"/>
  <text class="label" x="440" y="130" text-anchor="middle">passes the check</text>
  <path class="line" d="M500,164 L381,164" marker-end="url(#arrow)"/>
  <text class="label" x="440" y="206" text-anchor="middle">fails a later check</text>
  <path class="line" d="M680,150 L799,150" marker-end="url(#arrow)"/>
  <text class="label" x="740" y="140" text-anchor="middle">a person approves</text>
  <path class="line" d="M890,120 L890,56 L290,56 L290,119" marker-end="url(#arrow)"/>
  <text class="label" x="590" y="46" text-anchor="middle">new edition, document gone, table edited, or a person sends it back</text>
  <path class="line" d="M290,180 L290,236 L890,236 L890,180"/>
  <path class="line" d="M590,180 L590,279" marker-end="url(#arrow)"/>
  <text class="label" x="602" y="262" text-anchor="start">a person rejects</text>
  <path class="line" d="M500,310 L250,310 L250,181" marker-end="url(#arrow)"/>
  <text class="label" x="375" y="330" text-anchor="middle">a person sends it back</text>
  <path class="note" d="M24,356 L466,356 L480,370 L480,398 L24,398 Z"/>
  <text class="ntext" x="36" y="382">The check includes a second reading when [derived] names a reader</text>
  <path class="note" d="M744,264 L1000,264 L1014,278 L1014,340 L744,340 Z"/>
  <text class="ntext" x="756" y="289.5">Decides once loading admits it:</text>
  <text class="ntext" x="756" y="306.5">status in admit, check passed,</text>
  <text class="ntext" x="756" y="323.5">table unchanged, edition in force</text>
  <text class="label strong" x="24" y="450" text-anchor="start">A document that disagrees with a supplied fact</text>
  <circle class="dot" cx="64" cy="502" r="8"/>
  <rect class="conflict" x="200" y="476" width="180" height="52" rx="26"/>
  <text class="name" x="290" y="506" text-anchor="middle">open</text>
  <rect class="conflict" x="500" y="476" width="180" height="52" rx="26"/>
  <text class="name" x="590" y="506" text-anchor="middle">resolved</text>
  <path class="line" d="M72,502 L199,502" marker-end="url(#arrow)"/>
  <text class="label" x="136" y="492" text-anchor="middle">run finds it</text>
  <path class="line" d="M380,502 L499,502" marker-end="url(#arrow)"/>
  <text class="label" x="440" y="492" text-anchor="middle">a person resolves</text>
  <text class="label" x="712" y="507" text-anchor="start">The supplied fact decides throughout</text>
</svg>
